<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客编辑工具</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --text:#24292f; --dim:#6b7280;
    --brand:#1E90FF; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{background:var(--panel);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:12px;flex:none}
  header h1{font-size:15px;font-weight:600}
  header .dir{color:var(--dim);font-size:12px;margin-left:auto;
              max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;
         border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
  button:hover{border-color:#c8ccd2;background:#fafbfc}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{background:#1a7fdd}
  button.danger{color:var(--err)}
  button.danger:hover{background:#fef2f2;border-color:#fca5a5}

  main{flex:1;display:flex;min-height:0}
  aside{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  aside .search{padding:10px;border-bottom:1px solid var(--line)}
  aside .search input{width:100%}
  #list{flex:1;overflow-y:auto}
  .item{padding:10px 12px;border-bottom:1px solid #f0f2f4;cursor:pointer}
  .item:hover{background:#f7f9fb}
  .item.active{background:#eaf4ff;border-left:3px solid var(--brand);padding-left:9px}
  .item .t{font-weight:500;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
  .item .m{color:var(--dim);font-size:11px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}

  .work{flex:1;display:flex;flex-direction:column;min-width:0}

  .fm{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;
      display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;flex:none}
  .fm label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  .fm input,.fm select{width:100%}
  input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);
                        border-radius:6px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(30,144,255,.12)}
  .fm .wide{grid-column:1/-1}

  .split{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .pane + .pane{border-left:1px solid var(--line)}
  .pane .ph{padding:7px 14px;font-size:12px;color:var(--dim);background:#fafbfc;
            border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
  .pane .ph .sp{margin-left:auto;font-size:11px}
  #body{flex:1;border:0;border-radius:0;resize:none;padding:14px 16px;
        font:13px/1.75 "Cascadia Code",Consolas,"Microsoft YaHei",monospace;outline:none}
  #preview{flex:1;overflow-y:auto;padding:16px 22px;background:#fff}
  #preview h1,#preview h2,#preview h3{margin:16px 0 8px;line-height:1.3}
  #preview h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px}
  #preview h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:5px}
  #preview h3{font-size:15px}
  #preview p{margin:9px 0}
  #preview code{background:#f3f4f6;padding:2px 5px;border-radius:4px;
                font:12px Consolas,monospace;color:#b91c1c}
  #preview pre{background:#f6f8fa;border:1px solid var(--line);border-radius:6px;
               padding:11px 13px;overflow-x:auto;margin:11px 0}
  #preview pre code{background:none;padding:0;color:inherit}
  #preview ul,#preview ol{margin:9px 0 9px 22px}
  #preview li{margin:3px 0}
  #preview a{color:var(--brand)}
  #preview blockquote{border-left:3px solid var(--line);color:var(--dim);
                      padding:2px 0 2px 12px;margin:11px 0}
  #preview table{border-collapse:collapse;margin:11px 0}
  #preview th,#preview td{border:1px solid var(--line);padding:6px 10px}
  #preview img{max-width:100%}

  .coverpick{display:flex;gap:6px;align-items:center}
  .coverpick img{width:52px;height:32px;object-fit:cover;border-radius:4px;
                 border:1px solid var(--line)}

  .log{height:170px;flex:none;background:#1e2228;color:#d6dae0;
       font:12px/1.55 Consolas,monospace;overflow-y:auto;padding:9px 13px;
       border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
  .log.hide{display:none}
  .log .c0{color:#7ee787}.log .c1{color:#ffa198}

  .bar{display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--panel);
       border-top:1px solid var(--line);flex:none}
  .bar .st{font-size:12px;color:var(--dim);margin-left:auto}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--dim);margin-right:5px;vertical-align:middle}
  .dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.busy{background:var(--warn)}
</style>
</head>
<body>

<header>
  <h1>博客编辑工具</h1>
  <button id="btnNew">＋ 新文章</button>
  <button id="btnReload">↻ 重新载入</button>
  <span class="dir" id="blogDir"></span>
</header>

<main>
  <aside>
    <div class="search"><input id="q" placeholder="搜索标题…"></div>
    <div id="list"></div>
  </aside>

  <div class="work">
    <div class="fm">
      <label>文件名 <input id="fFile" readonly style="background:#fafbfc;color:#6b7280"></label>
      <label>标题 <input id="fTitle" placeholder="文章标题"></label>
      <label>日期 <input id="fDate" placeholder="2026-09-25 10:30:00"></label>
      <label>标签（逗号分隔） <input id="fTags" placeholder="Windows, 音频"></label>
      <label>分类（逗号分隔） <input id="fCats" placeholder="踩坑记录"></label>
      <label>封面
        <select id="fCover"><option value="">（用默认封面）</option></select>
      </label>
      <div class="wide coverpick">
        <img id="coverThumb" alt="" style="display:none">
        <span style="font-size:12px;color:var(--dim)" id="coverHint"></span>
      </div>
    </div>

    <div class="split">
      <div class="pane">
        <div class="ph">Markdown
          <span class="sp" id="wc">0 字</span>
        </div>
        <textarea id="body" spellcheck="false" placeholder="正文…"></textarea>
      </div>
      <div class="pane">
        <div class="ph">预览
          <span class="sp" id="pvState"></span>
        </div>
        <div id="preview"></div>
      </div>
    </div>

    <div class="log hide" id="log"></div>

    <div class="bar">
      <button class="primary" id="btnSave">保存</button>
      <button id="btnGen">生成</button>
      <button class="primary" id="btnPub">一键发布</button>
      <button id="btnLog">显示日志</button>
      <button class="danger" id="btnDel" style="margin-left:auto">删除</button>
      <span class="st" id="status"><span class="dot"></span>就绪</span>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let posts = [], cur = null, dirty = false, pollTimer = null, curJob = null, logSince = 0;

function setStatus(text, kind){
  $('status').innerHTML = '<span class="dot ' + (kind||'') + '"></span>' + text;
}

async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  const j = await r.json().catch(()=>({error:'响应不是 JSON'}));
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// ---------------- 列表 ----------------
async function loadPosts(){
  const d = await api('/api/posts');
  posts = d.posts; $('blogDir').textContent = d.blogDir;
  renderList();
}
function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const box = $('list'); box.innerHTML = '';
  const shown = posts.filter(p => !q || (p.title||'').toLowerCase().includes(q));
  if(!shown.length){ box.innerHTML = '<div style="padding:16px;color:#6b7280;font-size:12px">没有匹配的文章</div>'; return; }
  for(const p of shown){
    const el = document.createElement('div');
    el.className = 'item' + (cur && cur.file === p.file ? ' active' : '');
    const date = (p.date||'').slice(0,16);
    el.innerHTML = '<div class="t"></div><div class="m"><span>' + date +
                   '</span><span>' + (p.words||0) + ' 字</span>' +
                   (p.cover ? '<span>有封面</span>' : '') + '</div>';
    el.querySelector('.t').textContent = p.title || p.file;
    el.onclick = () => open(p.file);
    box.appendChild(el);
  }
}

// ---------------- 打开 / 保存 ----------------
async function open(file){
  if(dirty && !confirm('当前修改还没保存，确定要切换吗？')) return;
  const d = await api('/api/post?file=' + encodeURIComponent(file));
  cur = {file:d.file, front:d.front||{}};
  $('fFile').value = d.file;
  $('fTitle').value = cur.front.title || '';
  $('fDate').value = cur.front.date || '';
  $('fTags').value = (cur.front.tags||[]).join(', ');
  $('fCats').value = (cur.front.categories||[]).join(', ');
  $('fCover').value = cur.front.cover || '';
  syncCoverThumb();
  $('body').value = d.body || '';
  dirty = false;
  renderList(); renderPreview(); updateWC();
  setStatus('已打开 ' + d.file);
}

function collect(){
  const splitList = s => s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  return {
    file: $('fFile').value,
    front: {
      title: $('fTitle').value.trim(),
      cover: $('fCover').value,
      date: $('fDate').value.trim(),
      tags: splitList($('fTags').value),
      categories: splitList($('fCats').value),
    },
    body: $('body').value,
  };
}

async function save(){
  const d = collect();
  if(!d.file){ alert('请先选择或新建一篇文章'); return false; }
  if(!d.front.title){ alert('标题不能为空'); return false; }
  await api('/api/save', {method:'POST', body: JSON.stringify(d)});
  dirty = false;
  await loadPosts();
  renderList();
  setStatus('已保存', 'ok');
  return true;
}

// ---------------- 预览 ----------------
let pvTimer = null;
function renderPreview(){
  clearTimeout(pvTimer);
  $('pvState').textContent = '渲染中…';
  pvTimer = setTimeout(async () => {
    try{
      const d = await api('/api/preview', {method:'POST', body: JSON.stringify({body: $('body').value})});
      $('preview').innerHTML = d.html;
      $('pvState').textContent = '';
    }catch(e){ $('pvState').textContent = '渲染失败'; }
  }, 220);
}
function updateWC(){ $('wc').textContent = $('body').value.length + ' 字'; }

// ---------------- 封面 ----------------
async function loadCovers(){
  const d = await api('/api/covers');
  const sel = $('fCover');
  for(const c of d.covers){
    const o = document.createElement('option');
    o.value = c.path; o.textContent = c.name; o.dataset.url = c.url;
    sel.appendChild(o);
  }
  syncCoverThumb();
}
function syncCoverThumb(){
  const sel = $('fCover'), o = sel.options[sel.selectedIndex];
  const thumb = $('coverThumb'), hint = $('coverHint');
  if(sel.value && o && o.dataset.url){
    thumb.src = o.dataset.url; thumb.style.display = '';
    hint.textContent = sel.value;
  }else{
    thumb.style.display = 'none';
    hint.textContent = '没选封面时用主题默认图';
  }
}

// ---------------- 任务日志 ----------------
function showLog(on){ $('log').classList.toggle('hide', !on); $('btnLog').textContent = on ? '隐藏日志' : '显示日志'; }
function appendLog(lines){
  const box = $('log');
  for(const ln of lines){
    const div = document.createElement('div');
    div.textContent = ln;
    if(/ERROR|错误|失败/.test(ln)) div.className = 'c1';
    else if(/INFO|Generated|Deploy done/.test(ln)) div.className = 'c0';
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}
async function pollJob(){
  if(!curJob) return;
  const d = await api('/api/job?id=' + curJob + '&since=' + logSince);
  appendLog(d.lines); logSince = d.next;
  if(d.done){
    clearInterval(pollTimer); pollTimer = null; curJob = null;
    if((d.code||0) === 0) setStatus('完成：' + (d.label||''), 'ok');
    else setStatus('失败（退出码 ' + d.code + '）', 'err');
    await loadPosts(); renderList();
  }
  return d;
}
async function run(action){
  if(action === 'publish' && dirty){
    if(!await save()) return;
  }else if(dirty){
    if(!confirm('有未保存的修改，仍要继续吗？')) return;
  }
  showLog(true);
  $('log').innerHTML = '';
  logSince = 0;
  const d = await api('/api/run', {method:'POST', body: JSON.stringify({action})});
  curJob = d.job;
  setStatus('执行中…', 'busy');
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => { try{ await pollJob(); }catch(e){} }, 700);
}

// ---------------- 事件 ----------------
$('body').addEventListener('input', () => { dirty = true; renderPreview(); updateWC(); });
['fTitle','fDate','fTags','fCats'].forEach(id =>
  $(id).addEventListener('input', () => dirty = true));
$('fCover').addEventListener('change', () => { dirty = true; syncCoverThumb(); });
$('q').addEventListener('input', renderList);

$('btnSave').onclick = () => save().catch(e => { alert('保存失败：' + e.message); setStatus('保存失败','err'); });
$('btnGen').onclick = () => run('generate');
$('btnPub').onclick = () => run('publish');
$('btnLog').onclick = () => showLog($('log').classList.contains('hide'));
$('btnReload').onclick = () => location.reload();

$('btnNew').onclick = async () => {
  const title = prompt('新文章标题：');
  if(!title) return;
  const cover = $('fCover').value;
  const d = await api('/api/newfile', {method:'POST', body: JSON.stringify({title, cover})});
  await loadPosts();
  await open(d.file);
  setStatus('已创建 ' + d.file, 'ok');
};

$('btnDel').onclick = async () => {
  if(!cur){ alert('还没打开文章'); return; }
  if(!confirm('确定删除《' + ($('fTitle').value||cur.file) + '》？\n\n这个操作只删本地文件，需要再点「一键发布」才会从线上移除。')) return;
  await api('/api/delete', {method:'POST', body: JSON.stringify({file: cur.file})});
  cur = null; dirty = false;
  ['fFile','fTitle','fDate','fTags','fCats'].forEach(i => $(i).value = '');
  $('fCover').value = ''; syncCoverThumb();
  $('body').value = ''; $('preview').innerHTML = '';
  await loadPosts(); renderList();
  setStatus('已删除', 'ok');
};

window.addEventListener('beforeunload', e => {
  if(dirty){ e.preventDefault(); e.returnValue = ''; }
});

(async function init(){
  await loadPosts();
  await loadCovers();
  if(posts.length) await open(posts[0].file);
  else setStatus('还没有文章，点「＋ 新文章」开始');
  renderPreview();
})();
</script>
</body>
</html>
