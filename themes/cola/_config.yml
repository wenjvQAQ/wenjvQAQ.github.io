# ============================================================
#  hexo-theme-cola 配置
#
#  注意：这个主题的配置项大多是「数组的数组」（menu / links / musics /
#  tools / likes），而 Hexo 在合并 _config.<theme>.yml 时会对嵌套数组做
#  逐元素合并，导致内容错乱（比如 likes 会变成主题作者 + 你的条目混在一起）。
#  所以这里直接改主题自己的配置文件，不用 _config.cola.yml。
#
#  主题仓库：https://github.com/Aizener/hexo-theme-cola
# ============================================================

title: wenjvQAQ 的技术笔记

# 左侧栏显示的名字
author_name: wenjvQAQ

# 左侧栏标签（这个主题只支持两个）
tag1: 开发
tag2: 折腾

# 左侧栏 GitHub 链接
github_url: https://github.com/wenjvQAQ

# 座右铭，分两句显示
motto_prev: "记录踩过的坑"
motto_last: "和填过的坑"

# 小站启用日期（用于显示运营天数）
public_date: 2026-09-25

# 左侧栏菜单
menu:
  - [小站首页, '/', 'icon-shouye']
  - [个人日志, '/log', 'icon-rizhi']
  - [友情链接, '/link', 'icon-youqinglianjie']
  - ['关于自己', '/about', 'icon-guanyuwomen']
  - ['我的工具', '/tools', 'icon-gongju']

# 友情链接：[头像, 名字, 链接]
links:
  - ['https://hexo.io/logo.svg', 'Hexo', 'https://hexo.io/zh-cn/']
  - ['https://raw.githubusercontent.com/Aizener/hexo-theme-cola/master/source/imgs/avatar.jpg', 'Cola 主题', 'https://github.com/Aizener/hexo-theme-cola']

# 右侧栏公告
notice: 这里记录我在实际开发中真实遇到的问题，以及最后怎么解决的。尽量把排查过程也写出来，包括走过的弯路。

# 右侧音乐播放器：[歌名, 作者, 音频链接, 封面]
#
# ⚠️ 不要用 https://music.163.com/song/media/outer/url?id=xxx.mp3 这种写法。
#    它在 curl 里能 302，但在浏览器里会 MEDIA_ELEMENT_ERROR: Format error。
#    原因：302 的 Location 是 http://mXXX.music.126.net/...（明文），
#    页面在 https 下会被按混合内容处理；而且这个跳转本身对
#    <audio> 的 media 请求不友好（fetch 直接 Failed to fetch）。
#
#    正确做法：用 CDN 直链，并且把协议改成 https。
#    实测这些直链即使去掉 ?vuutv=... 签名参数也照样 200，
#    路径里的日期段也不是过期凭证（隔了 15 分钟仍然可播）。
#    如果哪天真的失效了，用 outer/url 重新抓一次 Location 换进去即可。
musics:
  - ['突然的陀螺', 'UR', 'https://m701.music.126.net/20260925163746/5b58ec1963d75a808ecb9157bbf22465/jdymusic/obj/wo3DlMOGwrbDjj7DisKw/80762698888/6c00/a9e5/53d3/71253a9c88eb42a86a2e255615a0308a.mp3', 'https://p1.music.126.net/WlISdpwXFxaVHJjo8n4Wfg==/109951173355866202.jpg']
  - ['蜘蛛糸モノポリー', 'sasakure.UK / 初音ミク', 'https://m10.music.126.net/20260925163746/eacda1f221f5a1032ea68ccbd0977d2e/ymusic/d971/09e9/8e2d/481fe9cc01c508917c9cbecc0402cb8f.mp3', 'https://p1.music.126.net/b6cwIaAUy5MXSm3iNC0KNg==/109951163352158677.jpg']

# 个人介绍（显示在「关于自己」页）
# 这一块在首页是整体隐藏的，见 index.styl 的 .main-left--statics.none
#
# 支持简单标记：[[文字](链接)] 会渲染成超链接，
# 也就是写 [[space.bilibili.com/686594756](https://space.bilibili.com/686594756)]
likes:
  - id：wenjv3930（文具）
  - 'B站：[[space.bilibili.com/686594756](https://space.bilibili.com/686594756)]'
  - 爱好：一个高中生，就读于广州市第二中学南沙天元学校，平常喜欢打王牌竞速、F1 系列、明日方舟／终末地和 BanG Dream

# 工具列表：[封面, 标题, 介绍, 链接]
# 封面留空 -> 用主题自己的 default-cover.webp
# （之前指向 raw.githubusercontent.com，大陆访问经常加载不出来）
tools:
  - ['', '网易云音乐解析器', '基于 PySide6 的网易云音乐 GUI，支持在线播放、同步歌词、歌单管理和批量下载', 'https://github.com/wenjvQAQ']
  - ['', 'UxPlay 便携版', '把 AirPlay 接收端做成免安装的便携包，插上 U 盘就能用', 'https://github.com/wenjvQAQ']

# 左侧个人卡片下方的统计方块（分类 / 标签 / 归档）是否显示
# 关了以后三个方块会隐藏，卡片底部的留白也一起去掉
show_statics: false

# 网站备案号（没有就留空，留空则不显示）
copyright:

# 文章评论
# ⚠️ 主题默认带的是作者自己的 Valine 配置，用它会把你的访客评论
#    写到作者的数据库里，所以这里关闭。
comments:
  enable: false
  appId: ''
  appKey: ''
  placeholder: '请留下你宝贵的意见吧~'
  meta: ['nick']
  recordIP: false
  visitor: false
  enableQQ: false

# 纪念模式：none 不设置 / all 全部置灰 / index 首页置灰
gray: none

# 首页日志摘要的最大高度（超出后折叠）
log_text_num: 1000

version: 1.0.2
